name: Репост из Telegram в ВК

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repost
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Перенести новые посты
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TOPICS: ${{ vars.TOPICS }}
        run: python3 repost.py

      - name: Запомнить обработанные посты
        run: |
          git config user.name "panda-bot"
          git config user.email "bot@panda-group.pro"
          git add state.json feed_items.json docs/feed.xml docs/p
          git diff --cached --quiet || git commit -m "repost state $(date +%FT%H:%M)"
          git push

      - name: Обновить RSS-ленту для Дзена
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/pandagrouppro-glitch/pandagrouppro-glitch.github.io.git" site
          cp docs/feed.xml site/feed.xml
          mkdir -p site/p
          cp -r docs/p/. site/p/
          cd site
          git config user.name "panda-bot"
          git config user.email "bot@panda-group.pro"
          git add feed.xml p
          git diff --cached --quiet || (git commit -m "feed $(date +%FT%H:%M)" && git push)
